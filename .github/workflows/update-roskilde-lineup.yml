name: Opdater Roskilde line-up

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  update-lineup:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scrape line-up fra Roskilde Festival
        run: python3 scripts/roskilde/build_lineup_data.py

      - name: Validér output
        run: |
          ANTAL=$(python3 -c "import json; d=json.load(open('output/lineup_data.json')); print(len(d['items']))")
          echo "Fandt $ANTAL acts"
          if [ "$ANTAL" -lt 50 ]; then
            echo "For få acts ($ANTAL < 50) — afviser og bevarer last-good"
            exit 1
          fi

      - name: Send til ingest-endpoint (DB-cache)
        run: |
          RESPONSE=$(curl -s -L -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "x-ingest-token: ${{ secrets.ROSKILDE_INGEST_TOKEN }}" \
            -d @output/lineup_data.json \
            https://albertdieckmann.dk/api/roskilde/ingest)
          BODY=$(echo "$RESPONSE" | head -n -1)
          STATUS=$(echo "$RESPONSE" | tail -n 1)
          echo "HTTP $STATUS: $BODY"
          if [ "$STATUS" != "200" ]; then
            echo "Ingest fejlede (HTTP $STATUS) — last-good bevares"
            exit 1
          fi

      - name: Opdatér fallback-fil i public/ (last-good backup)
        run: |
          mkdir -p public/roskilde
          cp output/lineup_data.json public/roskilde/lineup.json

      - name: Commit fallback-fil hvis ændret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/roskilde/lineup.json; then
            echo "Ingen ændringer i fallback-fil"
          else
            ANTAL=$(python3 -c "import json; d=json.load(open('public/roskilde/lineup.json')); print(len(d['items']))")
            git add public/roskilde/lineup.json
            git commit -m "Auto-opdater Roskilde line-up ($ANTAL acts)"
            git push
          fi
